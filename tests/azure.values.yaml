db:
  user: admin
  host: db.default.svc
  secret:
    key: password
    name: local-db

host: someurl.com
cert-manager:
  enabled: true
  namespace: certmanager

outboundMode: true

ingress-nginx:
  enabled: true
  controller:
    ingressClass: "nginx"
    extraArgs:
      default-ssl-certificate: federatednode/my-tls-secret
certs:
  frequency: 65
  azure:
    secret: test-azure-qc
    configmap: test-azure-qc
storage:
  azure:
    secretName: azstorage
    shareName: files
on_aks: true
